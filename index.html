!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mines Prediction Tool</title>
<style>
:root{--bg1:#0a0f2c;--bg2:#2a0a4a;--bg3:#04323a;--text:#eaf0ff;--muted:#9fb0d8;--glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.18);--tile:rgba(255,255,255,.07);--safe:#2bff88;--bomb:#ff3b5c;--accent:#7c5cff;--shadow:rgba(124,92,255,.45);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#dfe8ff;--bg2:#f1defa;--bg3:#d5f5ee;--text:#1b2140;--muted:#56608a;--glass:rgba(255,255,255,.6);--border:rgba(60,70,140,.2);--tile:rgba(255,255,255,.75);--safe:#0bb860;--bomb:#e0244a;--shadow:rgba(100,80,220,.25)}}
:root[data-theme="light"]{--bg1:#dfe8ff;--bg2:#f1defa;--bg3:#d5f5ee;--text:#1b2140;--muted:#56608a;--glass:rgba(255,255,255,.6);--border:rgba(60,70,140,.2);--tile:rgba(255,255,255,.75);--safe:#0bb860;--bomb:#e0244a;--shadow:rgba(100,80,220,.25)}
:root[data-theme="dark"]{--bg1:#0a0f2c;--bg2:#2a0a4a;--bg3:#04323a;--text:#eaf0ff;--muted:#9fb0d8;--glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.18);--tile:rgba(255,255,255,.07);--safe:#2bff88;--bomb:#ff3b5c;--shadow:rgba(124,92,255,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));background-size:400% 400%;animation:bg 22s ease infinite;display:flex;justify-content:center;align-items:center;padding:16px;overflow-x:hidden}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.orbs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.orbs i{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 70%);opacity:.35;filter:blur(6px);animation:float 14s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-60px) scale(1.2)}}
.card{position:relative;z-index:1;width:100%;max-width:460px;padding:22px;border-radius:24px;background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px var(--shadow),inset 0 0 30px rgba(255,255,255,.04)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:1.25rem;margin:0}
#platformName{margin:6px 0 16px;font-size:1.6rem;font-weight:800;text-align:center;background:linear-gradient(90deg,var(--safe),var(--accent),var(--bomb));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .4s}
label{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--tile);color:var(--text);font-size:1rem;outline:none;transition:.25s}
select option{color:#111}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--shadow)}
.btns{display:flex;gap:10px;margin:16px 0}
button{font:inherit;cursor:pointer;border:0;color:#fff;font-weight:700;padding:13px 16px;border-radius:12px;transition:transform .15s,box-shadow .25s,filter .2s}
button:hover{transform:translateY(-2px);filter:brightness(1.12)}
button:active{transform:scale(.95)}
#predict{flex:2;background:linear-gradient(135deg,#7c5cff,#19c37d);box-shadow:0 6px 22px var(--shadow)}
#reset{flex:1;background:rgba(255,255,255,.14);border:1px solid var(--border);color:var(--text)}
#theme{padding:8px 12px;background:var(--tile);border:1px solid var(--border);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,2vw,10px);padding:12px;border-radius:18px;border:1px solid var(--border);box-shadow:0 0 28px var(--shadow),inset 0 0 18px rgba(0,0,0,.15);margin:0 auto}
.tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(1.3rem,7vw,2rem);border-radius:14px;background:var(--tile);border:1px solid var(--border);padding:0;color:var(--text);position:relative;transition:transform .25s,background .4s,box-shadow .4s,border-color .4s}
.tile:hover{transform:scale(1.07);border-color:var(--accent)}
.tile span{opacity:0;transform:scale(0) rotate(-90deg);transition:.45s cubic-bezier(.3,1.6,.5,1)}
.tile.show span{opacity:1;transform:none}
.tile.safe{background:rgba(43,255,136,.16);border-color:var(--safe);box-shadow:0 0 18px var(--safe);animation:pulse 2s ease-in-out infinite}
.tile.bomb{background:rgba(255,59,92,.14);border-color:var(--bomb);box-shadow:0 0 14px var(--bomb)}
@keyframes pulse{50%{box-shadow:0 0 30px var(--safe),0 0 6px var(--safe) inset}}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
#info{text-align:center;font-size:.85rem;color:var(--muted);min-height:1.2em;margin-top:12px}
.note{font-size:.7rem;color:var(--muted);text-align:center;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<div class="orbs"><i style="width:220px;height:220px;left:5%;top:10%"></i><i style="width:300px;height:300px;right:0;top:50%;animation-delay:-5s"></i><i style="width:160px;height:160px;left:40%;bottom:5%;animation-delay:-9s"></i></div>
<main class="card">
  <div class="top"><h1>💎 Mines Predictor</h1><button id="theme" aria-label="Toggle theme">🌓</button></div>
  <div id="platformName">Bnbzilla</div>
  <label for="platform">Game platform</label>
  <select id="platform"><option>Bnbzilla</option><option>Bnbpick</option><option>Ltcpick</option></select>
  <label for="seed">Enter your client seed</label>
  <input id="seed" type="text" placeholder="e.g. my-client-seed-123" autocomplete="off">
  <div class="btns"><button id="predict">Predict Safe Mines</button><button id="reset">Reset</button></div>
  <div class="grid" id="grid"></div>
  <div id="info">Enter a seed and tap predict.</div>
  <p class="note">Entertainment only: results are generated locally from your seed and cannot predict real game outcomes. Provably-fair games use server seeds you can't see. Gamble responsibly.</p>
</main>
<script>
const grid=document.getElementById('grid'),info=document.getElementById('info'),
seedEl=document.getElementById('seed'),plat=document.getElementById('platform'),
tiles=[];
for(let i=0;i<25;i++){const t=document.createElement('button');t.className='tile';t.innerHTML='<span></span>';t.setAttribute('aria-label','Tile '+(i+1));
t.onclick=()=>{t.animate([{transform:'scale(.85)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],{duration:250})};
grid.appendChild(t);tiles.push(t)}
function hash(str){let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
for(let i=0;i<str.length;i++){const k=str.charCodeAt(i);h1=h2^Math.imul(h1^k,597399067);h2=h3^Math.imul(h2^k,2869860233);h3=h4^Math.imul(h3^k,951274213);h4=h1^Math.imul(h4^k,2716044179)}
h1=Math.imul(h3^(h1>>>18),597399067);h2=Math.imul(h4^(h2>>>22),2869860233);return (h1^h2)>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clear(){tiles.forEach(t=>{t.className='tile';const s=t.firstChild;s.textContent='';})}
plat.onchange=()=>{const n=document.getElementById('platformName');n.textContent=plat.value;n.style.animation='none';void n.offsetWidth;n.style.animation='pop .4s';clear();info.textContent='Platform changed. Predict again.'};
document.getElementById('predict').onclick=()=>{
 const seed=seedEl.value.trim();
 if(!seed){info.textContent='Please enter your client seed first.';seedEl.focus();return}
 clear();
 const r=rng(hash(plat.value+'|'+seed)),idx=[...Array(25).keys()];
 for(let i=24;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
 const safe=new Set(idx.slice(0,5));
 tiles.forEach((t,i)=>setTimeout(()=>{const s=safe.has(i);t.classList.add(s?'safe':'bomb','show');t.firstChild.textContent=s?'💎':'💣'},i*45));
 info.textContent='5 safe 💎 and 20 mines 💣 generated for "'+seed+'".';
};
document.getElementById('reset').onclick=()=>{clear();seedEl.value='';info.textContent='Grid cleared. Enter a new seed.'};
const root=document.documentElement;
try{const s=localStorage.getItem('theme');if(s)root.dataset.theme=s}catch(e){}
document.getElementById('theme').onclick=()=>{
 const dark=root.dataset.theme?root.dataset.theme==='dark':!matchMedia('(prefers-color-scheme:light)').matches;
 root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}};
</script>
</body>
</html>
